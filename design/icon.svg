<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6df5"/>
      <stop offset="1" stop-color="#2b3eb2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf4"/>
      <stop offset="1" stop-color="#e9e0c9"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- the B: vertical stem doubles as the book spine -->
  <g fill="url(#paper)" transform="translate(14 0)">
    <rect x="58" y="44" width="28" height="168" rx="14"/>
    <rect x="58" y="44" width="86" height="68" rx="22"/>
    <rect x="58" y="140" width="100" height="72" rx="24"/>
  </g>

  <!-- raised bands, like a hardcover spine -->
  <g fill="#1a2340" opacity="0.12" transform="translate(14 0)">
    <rect x="58" y="70" width="28" height="6" rx="3"/>
    <rect x="58" y="180" width="28" height="6" rx="3"/>
  </g>
</svg>
