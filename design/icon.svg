<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f6df5"/>
      <stop offset="1" stop-color="#2b3eb2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfbf4"/>
      <stop offset="1" stop-color="#e9e0c9"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- the B as one blob: stem (book spine) + body -->
  <rect x="72" y="44" width="28" height="168" rx="14" fill="url(#paper)"/>
  <rect x="72" y="44" width="98" height="168" rx="44" fill="url(#paper)"/>

  <!-- the counters, punched through with the background -->
  <rect x="108" y="64" width="42" height="38" rx="19" fill="url(#bg)"/>
  <rect x="108" y="118" width="50" height="74" rx="22" fill="url(#bg)"/>

  <!-- raised bands, like a hardcover spine -->
  <g fill="#1a2340" opacity="0.12">
    <rect x="72" y="70" width="28" height="6" rx="3"/>
    <rect x="72" y="180" width="28" height="6" rx="3"/>
  </g>
</svg>
