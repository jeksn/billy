<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6df5"/>
      <stop offset="1" stop-color="#2b3eb2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf4"/>
      <stop offset="1" stop-color="#e9e0c9"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- the B: the vertical stem is a book spine, the two bowls its covers -->
  <g fill="url(#paper)" transform="translate(14 0)">
    <rect x="58" y="44" width="30" height="168" rx="15"/>
    <rect x="58" y="44" width="88" height="70" rx="35"/>
    <rect x="58" y="142" width="102" height="70" rx="35"/>
  </g>

  <!-- raised bands, like a hardcover spine -->
  <g fill="#1a2340" opacity="0.15" transform="translate(14 0)">
    <rect x="58" y="72" width="30" height="6" rx="3"/>
    <rect x="58" y="178" width="30" height="6" rx="3"/>
  </g>
</svg>
