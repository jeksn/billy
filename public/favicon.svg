<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f6df5"/>
      <stop offset="1" stop-color="#2b3eb2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfbf4"/>
      <stop offset="1" stop-color="#e9e0c9"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- the mark: one solid blob, circle + spine stem -->
  <circle cx="128" cy="128" r="80" fill="url(#paper)"/>
  <rect x="64" y="36" width="28" height="184" rx="14" fill="url(#paper)"/>

  <!-- raised bands, like a hardcover spine -->
  <g fill="#1a2340" opacity="0.12">
    <rect x="64" y="62" width="28" height="6" rx="3"/>
    <rect x="64" y="188" width="28" height="6" rx="3"/>
  </g>
</svg>
